<!DOCTYPE html>
<html lang="ko">
<head><style>
@font-face {
  font-family: "Optimistic";
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
  src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");
}
@font-face {
  font-family: "Optimistic Mono";
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("/fonts/OptimisticMono_W_TextRegular.woff2") format("woff2");
}
:where(html) {
  font-family: "Optimistic", system-ui, sans-serif;
}
:where(code, pre, kbd, samp) {
  font-family: "Optimistic Mono", ui-monospace, monospace;
}
</style>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="여백">
<meta name="theme-color" content="#faf9f6">
<title>여백 — 프리미엄 독서</title>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Serif+KR:wght@300;400;600&family=Pretendard:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>if(window.pdfjsLib){ pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; }</script>
<style>
:root{
  --bg:#faf9f6; --bg2:#f2eee6; --text:#121212; --text2:#6b6b6b; --line:#e8e2d6;
  --accent:#111; --paper:#ffffff; --shadow:0 20px 60px rgba(0,0,0,.08);
  --font-sans:'Pretendard','Apple SD Gothic Neo',sans-serif;
  --font-serif:'Noto Serif KR','Gowun Batang',serif;
  --radius:18px; --max:720px;
  --fsize:19px; --lspace:-0.02em; --lh:1.92; --para:1.15em;
}
[data-theme="sepia"]{ --bg:#f5efe6; --bg2:#ece3d1; --text:#2b2117; --text2:#8a7c6a; --line:#e0d5c0; --paper:#fdf8ef; }
[data-theme="dark"]{ --bg:#18181b; --bg2:#232326; --text:#e9e6e1; --text2:#9a9590; --line:#2e2e32; --paper:#1e1e20; --accent:#f5f1eb; --shadow:0 20px 60px rgba(0,0,0,.4); }
[data-theme="black"]{ --bg:#000; --bg2:#111; --text:#e8e6e3; --text2:#8a8a8a; --line:#222; --paper:#0a0a0a; --accent:#f0ece6; }
*{box-sizing:border-box; -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; padding:0; background:var(--bg); color:var(--text); font-family:var(--font-sans); min-height:100%; overflow-x:hidden;}
button{font-family:inherit;}
.view{display:none; min-height:100dvh;}
.view.active{display:flex; flex-direction:column;}
#home-view{position:relative; align-items:center; justify-content:center; padding:48px 24px 40px; padding-top:calc(48px + env(safe-area-inset-top)); padding-bottom:calc(40px + env(safe-area-inset-bottom)); overflow:hidden;}
.home-bg{position:absolute; inset:0; background: radial-gradient(120% 80% at 50% -10%, #fff 0%, var(--bg) 60%), radial-gradient(80% 60% at 100% 0%, #f0e9da 0%, transparent 60%); pointer-events:none;}
[data-theme="dark"] .home-bg, [data-theme="black"] .home-bg{background: radial-gradient(120% 80% at 50% -10%, #232323 0%, var(--bg) 70%);}
.home-header{text-align:center; z-index:1; margin-bottom:48px;}
.logo-mark{width:72px; height:72px; border-radius:22px; background:var(--text); color:var(--bg); display:grid; place-items:center; font-family:var(--font-serif); font-weight:300; font-size:34px; margin:0 auto 24px; letter-spacing:-0.05em; box-shadow:var(--shadow);}
.home-header h1{font-family:var(--font-serif); font-weight:300; font-size:56px; letter-spacing:-0.06em; margin:0; line-height:1;}
.home-header .tagline{margin:14px 0 0; font-size:14px; letter-spacing:0.18em; color:var(--text2); text-transform:uppercase; font-weight:400;}
.home-actions{z-index:1; width:100%; max-width:340px; display:flex; flex-direction:column; gap:12px; margin-top:8px;}
.home-btn{appearance:none; border:1px solid var(--line); background:var(--paper); color:var(--text); border-radius:999px; padding:18px 22px; font-size:15px; font-weight:500; letter-spacing:-0.02em; display:flex; align-items:center; justify-content:space-between; cursor:pointer; transition:.25s; box-shadow:0 1px 0 rgba(0,0,0,.03);}
.home-btn:hover{transform:translateY(-1px); box-shadow:var(--shadow); border-color:var(--text);}
.home-btn.primary{background:var(--text); color:var(--bg); border-color:var(--text);}
.home-btn .ico{width:22px; height:22px; opacity:.9;}
.home-foot{z-index:1; margin-top:56px; font-size:11px; letter-spacing:0.12em; color:var(--text2); text-align:center; line-height:1.6;}
#library-view{padding:0; background:var(--bg);}
.lib-top{position:sticky; top:0; z-index:10; background:var(--bg); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); border-bottom:1px solid var(--line); padding:18px 20px 0; padding-top:calc(18px + env(safe-area-inset-top));}
.lib-top h2{font-family:var(--font-serif); font-weight:300; font-size:28px; margin:0 0 18px; letter-spacing:-0.04em; display:flex; align-items:center; gap:12px;}
.lib-tabs{display:flex; gap:20px;}
.tab{appearance:none; background:none; border:none; padding:0 0 14px; font-size:13px; letter-spacing:0.06em; color:var(--text2); border-bottom:1.5px solid transparent; margin-bottom:-1px; cursor:pointer; transition:.2s;}
.tab.active{color:var(--text); border-color:var(--text); font-weight:600;}
.lib-body{padding:20px; max-width:820px; margin:0 auto; width:100%;}
.book-grid{display:grid; gap:14px;}
.book-card{background:var(--paper); border:1px solid var(--line); border-radius:20px; padding:18px 18px 16px; display:flex; gap:16px; position:relative; transition:.2s; cursor:pointer;}
.book-card:hover{box-shadow:var(--shadow); transform:translateY(-1px);}
.book-cover{width:54px; height:72px; border-radius:10px; background:linear-gradient(160deg, var(--bg2), var(--line)); display:grid; place-items:center; font-family:var(--font-serif); font-size:22px; flex-shrink:0; color:var(--text2); border:1px solid var(--line);}
.book-meta{flex:1; min-width:0;}
.book-title{font-family:var(--font-serif); font-size:16px; font-weight:600; line-height:1.35; letter-spacing:-0.02em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.book-info{font-size:12px; color:var(--text2); margin-top:6px; display:flex; gap:10px; flex-wrap:wrap;}
.progress-bar{height:3px; background:var(--bg2); border-radius:999px; margin-top:12px; overflow:hidden;}
.progress-fill{height:100%; background:var(--text); width:0%; transition:.4s;}
.book-actions{display:flex; gap:6px; margin-left:auto; align-items:flex-start;}
.icon-btn{appearance:none; border:1px solid var(--line); background:var(--bg); width:32px; height:32px; border-radius:999px; display:grid; place-items:center; cursor:pointer; color:var(--text2); transition:.2s;}
.icon-btn:hover{color:var(--text); border-color:var(--text);}
.empty{padding:80px 20px; text-align:center; color:var(--text2); font-size:14px; line-height:1.7;}
.empty b{color:var(--text); font-family:var(--font-serif); font-weight:500;}
#reader-view{background:var(--paper); position:relative; min-height:100dvh;}
.toolbar{position:fixed; left:0; right:0; z-index:100; top:0; top:env(safe-area-inset-top, 0px); display:flex; align-items:center; justify-content:space-between; padding:12px 14px; padding-top:calc(12px + env(safe-area-inset-top, 0px)); background:var(--paper); border-bottom:1px solid var(--line); box-shadow:0 1px 0 rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.04); transition:transform .34s cubic-bezier(.2,.8,.2,1), opacity .24s; will-change:transform;}
@supports (-webkit-touch-callout: none){ .toolbar{ -webkit-backdrop-filter:blur(18px) saturate(1.2); backdrop-filter:blur(18px) saturate(1.2); background:color-mix(in srgb, var(--paper) 88%, transparent); } }
.toolbar.hidden{transform:translateY(-110%); opacity:0; pointer-events:none;}
.toolbar .left,.toolbar .right{display:flex; gap:8px; align-items:center;}
.t-icon{appearance:none; border:1px solid var(--line); background:var(--bg); width:42px; height:42px; border-radius:999px; display:grid; place-items:center; cursor:pointer; color:var(--text); transition:.2s; flex-shrink:0;}
.t-icon:hover{background:var(--text); color:var(--bg); border-color:var(--text);}
.progress-track{position:fixed; left:0; right:0; height:3px; background:var(--text); z-index:101; width:0%; top:0; top:env(safe-area-inset-top, 0px); transition:width .12s linear;}
.reader-wrap{width:100%; max-width:var(--max); margin:0 auto; padding:96px 22px 160px; padding-top:calc(92px + env(safe-area-inset-top, 0px)); padding-bottom:calc(160px + env(safe-area-inset-bottom));}
@media(max-width:600px){ .reader-wrap{padding-left:18px; padding-right:18px;} }
.chapter-head{margin:56px 0 36px; padding:0 0 28px; border-bottom:1px solid var(--line); text-align:center;}
.chapter-head .kicker{font-size:11px; letter-spacing:0.22em; color:var(--text2); text-transform:uppercase; margin-bottom:12px;}
.chapter-head h2{font-family:var(--font-serif); font-weight:300; font-size:clamp(26px,5vw,38px); line-height:1.25; letter-spacing:-0.05em; margin:0; word-break:keep-all;}
.chapter-head .deco{width:28px; height:1px; background:var(--text); margin:22px auto 0; opacity:.6;}
.p{margin:0 0 var(--para); font-family:var(--font-serif); font-size:var(--fsize); letter-spacing:var(--lspace); line-height:var(--lh); word-break:keep-all; overflow-wrap:break-word; text-align:justify; hanging-punctuation:first allow-end;}
.p.dialogue{position:relative; margin:1.2em 0; padding:0.2em 0 0.2em 1.3em; border-left:1.5px solid var(--text); background:color-mix(in srgb, var(--bg2) 55%, transparent); border-radius:0 8px 8px 0;}
.p.dialogue::before{content:'“'; position:absolute; left:-0.02em; top:-0.18em; font-family:var(--font-serif); font-size:1.8em; line-height:1; color:var(--text); opacity:.18;}
.inline-q{font-weight:600; letter-spacing:-0.01em;}
.title-line{font-family:var(--font-serif); font-weight:700; font-size:1.35em; margin:2.2em 0 0.8em; letter-spacing:-0.04em;}
.drawer{position:fixed; inset:0; z-index:110; display:none;}
.drawer.open{display:block;}
.drawer-bg{position:absolute; inset:0; background:rgba(0,0,0,.28); backdrop-filter:blur(4px);}
.drawer-panel{position:absolute; top:0; bottom:0; background:var(--paper); border-right:1px solid var(--line); box-shadow:var(--shadow); overflow:auto; padding:20px; padding-top:calc(20px + env(safe-area-inset-top, 0px));}
#toc-drawer .drawer-panel{left:0; width:min(360px,86vw);}
#settings-drawer .drawer-panel{right:0; left:auto; width:min(380px,88vw); border-right:none; border-left:1px solid var(--line);}
.drawer-h{font-family:var(--font-serif); font-size:20px; font-weight:300; letter-spacing:-0.04em; margin:6px 0 18px; display:flex; justify-content:space-between; align-items:center;}
.toc-list{display:flex; flex-direction:column; gap:2px;}
.toc-item{appearance:none; background:none; border:none; text-align:left; padding:12px 12px; border-radius:12px; cursor:pointer; font-size:14px; line-height:1.4; letter-spacing:-0.02em; color:var(--text2); transition:.15s; word-break:keep-all;}
.toc-item:hover{background:var(--bg2); color:var(--text);}
.toc-item.active{background:var(--text); color:var(--bg);}
.set-group{border-top:1px solid var(--line); padding:18px 0;}
.set-label{font-size:11px; letter-spacing:0.18em; text-transform:uppercase; color:var(--text2); margin-bottom:14px;}
.set-row{display:flex; gap:8px; flex-wrap:wrap;}
.font-opt{appearance:none; border:1px solid var(--line); background:var(--bg); border-radius:999px; padding:9px 14px; font-size:13px; cursor:pointer; transition:.2s;}
.font-opt.active{background:var(--text); color:var(--bg); border-color:var(--text);}
.range-row{display:flex; align-items:center; gap:12px; margin:10px 0;}
.range-row input[type=range]{flex:1; accent-color:var(--text);}
.theme-dots{display:flex; gap:10px;}
.theme-dot{width:32px; height:32px; border-radius:999px; border:2px solid var(--line); cursor:pointer; position:relative;}
.theme-dot.active{border-color:var(--text); box-shadow:0 0 0 3px var(--bg), 0 0 0 5px var(--text);}
#tts-bar{position:fixed; bottom:18px; bottom:calc(18px + env(safe-area-inset-bottom, 0px)); left:50%; transform:translateX(-50%); z-index:90; background:var(--text); color:var(--bg); border-radius:999px; padding:10px 12px 10px 16px; display:none; align-items:center; gap:12px; box-shadow:var(--shadow); max-width:calc(100vw - 20px);}
#tts-bar.show{display:flex;}
#tts-bar button{appearance:none; border:none; background:rgba(255,255,255,.12); color:inherit; width:36px; height:36px; border-radius:999px; display:grid; place-items:center; cursor:pointer;}
#paste-modal{position:fixed; inset:0; z-index:120; display:none; align-items:center; justify-content:center; padding:20px;}
#paste-modal.open{display:flex;}
#paste-modal .bg{position:absolute; inset:0; background:rgba(0,0,0,.35); backdrop-filter:blur(8px);}
.modal-box{position:relative; background:var(--paper); border:1px solid var(--line); border-radius:24px; width:100%; max-width:560px; box-shadow:var(--shadow); padding:22px; max-height:86vh; display:flex; flex-direction:column;}
.modal-box h3{font-family:var(--font-serif); font-weight:400; font-size:20px; margin:0 0 12px;}
.modal-box textarea{width:100%; min-height:260px; resize:vertical; border:1px solid var(--line); background:var(--bg); border-radius:14px; padding:14px; font-family:var(--font-serif); font-size:15px; line-height:1.7; color:var(--text);}
.modal-actions{display:flex; gap:10px; justify-content:flex-end; margin-top:14px;}
.btn{appearance:none; border-radius:999px; padding:11px 18px; font-size:14px; font-weight:500; cursor:pointer; border:1px solid var(--line); background:var(--bg); color:var(--text); transition:.2s;}
.btn.primary{background:var(--text); color:var(--bg); border-color:var(--text);}
</style>
</head>
<body>
<input type="file" id="file-input" hidden accept=".txt,.text,.md,.markdown,.html,.htm,.docx,.pdf,.epub">
<section id="home-view" class="view active">
  <div class="home-bg"></div>
  <div class="home-header"><div class="logo-mark">여</div><h1>여백</h1><div class="tagline">A quiet space for Korean texts</div></div>
  <div class="home-actions">
    <button class="home-btn primary" id="btn-open-library"><span>서재 열기</span><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg></button>
    <button class="home-btn" id="btn-open-file"><span>파일 열기</span><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg></button>
    <button class="home-btn" id="btn-paste-text"><span>텍스트 붙여넣기</span><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v3"/></svg></button>
  </div>
  <div class="home-foot">OFFLINE · v8</div>
</section>
<section id="library-view" class="view">
  <div class="lib-top"><h2><button class="t-icon" id="lib-back"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg></button>서재 <span id="lib-count" style="font-size:13px; color:var(--text2); font-family:var(--font-sans); font-weight:400; margin-left:4px;"></span></h2><div class="lib-tabs"><button class="tab active" data-tab="reading">읽고 있는 책</button><button class="tab" data-tab="finished">다 읽은 책</button><button class="tab" data-tab="all">전체</button></div></div>
  <div class="lib-body"><div id="book-grid" class="book-grid"></div></div>
</section>
<section id="reader-view" class="view">
  <div class="progress-track" id="progress-track"></div>
  <div class="toolbar" id="reader-toolbar">
    <div class="left"><button class="t-icon" id="r-home" title="홈"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></button><button class="t-icon" id="r-library" title="서재"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg></button></div>
    <div class="right"><button class="t-icon" id="r-toc" title="목차"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><path d="M3 6h.01M3 12h.01M3 18h.01"/></svg></button><button class="t-icon" id="r-tts" title="낭독"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg></button><button class="t-icon" id="r-settings" title="서식"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 9 15a1.65 1.65 0 0 0-1-1.51V13a2 2 0 0 1 4 0v.49c.39.23.74.56 1 1.02z"/></svg></button></div>
  </div>
  <div class="reader-wrap" id="reader-wrap"></div>
  <div id="tts-bar"><span id="tts-status" style="font-size:13px;">시스템 음성으로 읽는 중</span><button id="tts-pause"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg></button><button id="tts-stop"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>
</section>
<div class="drawer" id="toc-drawer"><div class="drawer-bg"></div><div class="drawer-panel"><div class="drawer-h"><span>목차</span><button class="t-icon" data-close="toc-drawer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div><div id="toc-list" class="toc-list"></div></div></div>
<div class="drawer" id="settings-drawer"><div class="drawer-bg"></div><div class="drawer-panel"><div class="drawer-h"><span>서식 · 글꼴</span><button class="t-icon" data-close="settings-drawer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>
  <div class="set-group"><div class="set-label">글꼴</div><div class="set-row" id="font-choices"></div></div>
  <div class="set-group"><div class="set-label">크기 · 자간 · 행간</div>
    <div class="range-row"><span style="font-size:12px; width:36px;">크기</span><input id="range-size" type="range" min="15" max="28" step="0.5"><span id="size-val" style="font-size:12px; width:28px; text-align:right;"></span></div>
    <div class="range-row"><span style="font-size:12px; width:36px;">자간</span><input id="range-lspace" type="range" min="-0.06" max="0.12" step="0.01"><span id="lspace-val" style="font-size:12px; width:28px; text-align:right;"></span></div>
    <div class="range-row"><span style="font-size:12px; width:36px;">행간</span><input id="range-lh" type="range" min="1.5" max="2.6" step="0.05"><span id="lh-val" style="font-size:12px; width:28px; text-align:right;"></span></div>

function decodeBuffer(buf){

const CHAPTER_PATTERNS=[/^\s*(제\s*\d+\s*[장화편부권절]|[0-9]+\s*장|[0-9]+\s*화|제\s*\d+화|제\d+장|프롤로그|prologue|에필로그|epilogue|서장|서문|본문|외전(\s*\d*)?|후기|작가\s*후기|일러두기|등장인물|제\s*\d+\s*부|제\s*\d+\s*막|인터미션|챕터\s*\d+|chapter\s*\d+|episode\s*\d+|part\s*\d+)\s*[:\-]?\s*(.*)$/i];
function detectChapters(text){
  const norm=text.replace(/\r\n/g,'\n').replace(/\r/g,'\n');

  for(let i=0;i<lines.length;i++){linePos.push(charPos); charPos+=lines[i].length+1;}

    const trimmed=lines[i].trim(); if(!trimmed) continue; if(trimmed.length>90) continue;
    if(/^#{1,3}\s+/.test(trimmed)){found.push({title:trimmed.replace(/^#+\s*/,'').trim(), index:linePos[i]}); continue;}
    for(const pat of CHAPTER_PATTERNS){ if(pat.test(trimmed)){ if(/^["“”]/.test(trimmed) && trimmed.length<20) break; found.push({title:trimmed, index:linePos[i]}); break; } }
  }
  if(found.length===0){
    const globalPat=/(제\s*\d+\s*[장화편부권절]|제\s*\d+화|\d+\s*장\s*[^\n]{0,30}|프롤로그|에필로그|서문|본문|외전\s*\d*|후기|Chapter\s*\d+|Episode\s*\d+)/gi;
    let m; while((m=globalPat.exec(norm))!==null){ const title=m[0].trim(); if(title.length>60) continue; found.push({title, index:m.index}); if(found.length>120) break; }
  }

}
function makeArbitraryTOC(text){

  return parts;
}
function escapeHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function isDialoguePara(t){const s=t.trim(); if(!s) return false; if(/^[—–―-]/.test(s)) return true; if(/^["“‘]/.test(s) && /["”’]$/.test(s) && s.length<600) return true; if(/^["“]/.test(s) && s.length<500) return true; if(/^[「『]/.test(s)) return true; if(/^".+"$/.test(s)) return true; return false;}
function smartSplitParagraphs(slice){
  const norm=slice.replace(/\r\n/g,'\n').replace(/\r/g,'\n').trim();
  if(!norm) return [];
  const doubleCount=(norm.match(/\n\s*\n/g)||[]).length;
  const lineCount=(norm.match(/\n/g)||[]).length;
  if(doubleCount>=3){
    return norm.split(/\n\s*\n/).map(s=>s.split('\n').map(l=>l.trim()).filter(Boolean).join(' ').replace(/\s{2,}/g,' ').trim()).filter(Boolean);
  }

    if(splitByChapter.length>1){
      const result=[]; for(const chunk of splitByChapter){ result.push(...splitBySentences(chunk)); }

    }

  }

function splitBySentences(text){

    seg=seg.trim(); if(!seg) continue;

}

}
async function parseTxtFile(file){const buf=await file.arrayBuffer(); return decodeBuffer(buf).replace(/\u0000/g,'');}

async function parseHtmlFile(file){const text=await parseTxtFile(file); try{const doc=new DOMParser().parseFromString(text,'text/html'); let out=''; doc.body.querySelectorAll('h1,h2,h3,h4,p,br,div,li').forEach(el=>{ if(/^H[1-3]$/i.test(el.tagName)) out+='\n\n'+el.innerText.trim()+'\n\n'; else out+=el.innerText+'\n\n';}); return out.trim()||doc.body.innerText;}catch{return text;}}

async function openReader(id){

['range-size','range-lspace','range-lh','range-rate'].forEach(id=>{document.getElementById(id)?.addEventListener('input',e=>{const v=parseFloat(e.target.value); if(id==='range-size'){settings.fsize=v; document.getElementById('size-val').textContent=v;} if(id==='range-lspace'){settings.lspace=v; document.getElementById('lspace-val').textContent=v;} if(id==='range-lh'){settings.lh=v; document.getElementById('lh-val').textContent=v;} if(id==='range-rate'){settings.rate=v; document.getElementById('rate-val').textContent=v.toFixed(1);} localStorage.setItem('yeobaek-settings',JSON.stringify(settings)); document.documentElement.style.setProperty('--fsize',settings.fsize+'px'); document.documentElement.style.setProperty('--lspace',settings.lspace+'em'); document.documentElement.style.setProperty('--lh',settings.lh); if(currentBook) renderBook(currentBook);});});
document.querySelectorAll('.theme-dot').forEach(dot=>{dot.addEventListener('click',()=>{settings.theme=dot.dataset.theme; localStorage.setItem('yeobaek-settings',JSON.stringify(settings)); document.documentElement.setAttribute('data-theme',settings.theme); document.querySelectorAll('.theme-dot').forEach(d=>d.classList.toggle('active',d.dataset.theme===settings.theme)); document.querySelector('meta[name="theme-color"]').setAttribute('content',settings.theme==='light'?'#faf9f6':settings.theme==='sepia'?'#f5efe6':'#18181b');});});
let ttsQueue=[]; let ttsIndex=0; let ttsSpeaking=false;
function populateVoices(){const sel=document.getElementById('voice-select'); const voices=speechSynthesis.getVoices(); const ko=voices.filter(v=>/ko|Korean/i.test(v.lang+v.name)); const list=ko.length?ko:voices; sel.innerHTML=''; list.forEach(v=>{const o=document.createElement('option');o.value=v.name;o.textContent=`${v.name} (${v.lang})`; sel.appendChild(o);}); if(ko[0]) sel.value=ko[0].name;}
speechSynthesis.onvoiceschanged=populateVoices; setTimeout(populateVoices,600);
function startTTS(){if(!currentBook) return; const secs=[...document.querySelectorAll('[data-chapter-id]')].filter(s=>s.getBoundingClientRect().top>-200); let txt=''; secs.forEach(s=>{txt+=s.innerText+'\n';}); if(!txt.trim()) txt=currentBook.content.slice(0,8000); ttsQueue=txt.split(/(?<=[.!?。…」”])\s+|\n+/).filter(s=>s.trim().length>2).slice(0,200); ttsIndex=0; document.getElementById('tts-bar').classList.add('show'); speakNext();}
function speakNext(){if(ttsIndex>=ttsQueue.length){stopTTS(); return;} const u=new SpeechSynthesisUtterance(ttsQueue[ttsIndex]); const sel=document.getElementById('voice-select'); const voices=speechSynthesis.getVoices(); const chosen=voices.find(v=>v.name===sel.value)||voices.find(v=>/ko/i.test(v.lang))||voices[0]; if(chosen) u.voice=chosen; u.lang=chosen?.lang||'ko-KR'; u.rate=settings.rate||1; u.onend=()=>{ttsIndex++; speakNext();}; u.onerror=()=>{ttsIndex++; speakNext();}; speechSynthesis.speak(u); document.getElementById('tts-status').textContent=`${ttsIndex+1} / ${ttsQueue.length} · ${chosen?.name||'시스템 음성'}`;}
function stopTTS(){speechSynthesis.cancel(); document.getElementById('tts-bar').classList.remove('show'); ttsQueue=[]; ttsIndex=0;}
function pauseTTS(){if(speechSynthesis.paused) speechSynthesis.resume(); else speechSynthesis.pause();}

document.getElementById('book-grid').addEventListener('click', async e=>{
  const btn=e.target.closest('[data-act]');
  if(btn){
    const id=btn.dataset.id;
    if(btn.dataset.act==='del'){ if(confirm('서재에서 삭제할까요?')){ await dbDel(id); renderLibrary(); } }
    else if(btn.dataset.act==='read'){ openReader(id); }
    return;
  }
  const card=e.target.closest('.book-card'); if(card){ const bid=card.querySelector('[data-id]')?.dataset.id; if(bid) openReader(bid); }
});

document.getElementById('btn-paste-text').addEventListener('click',()=>{ pasteModal.classList.add('open'); });
document.getElementById('paste-cancel').addEventListener('click',()=>pasteModal.classList.remove('open'));
pasteModal.querySelector('.bg').addEventListener('click',()=>pasteModal.classList.remove('open'));

fileInput.addEventListener('change', async e=>{const file=e.target.files[0]; if(!file) return; const name=file.name.toLowerCase(); let text=''; try{document.body.style.cursor='wait'; if(name.endsWith('.txt')||name.endsWith('.text')) text=await parseTxtFile(file); else if(name.endsWith('.md')) text=await parseMdFile(file); else if(name.endsWith('.html')||name.endsWith('.htm')) text=await parseHtmlFile(file); else if(name.endsWith('.docx')) text=await parseDocxFile(file); else if(name.endsWith('.pdf')) text=await parsePdfFile(file); else if(name.endsWith('.epub')) text=await parseEpubFile(file); else text=await parseTxtFile(file); if(!text.trim()) throw new Error('텍스트 추출 실패'); await addBookFromText(text, file.name.replace(/\.[^.]+$/,''));}catch(err){alert('읽기 오류: '+(err.message||err));}finally{document.body.style.cursor='auto'; fileInput.value='';}});

initSettingsUI(); populateVoices(); renderLibrary();

<script>(function(){var loc=location.href.replace(/#.*$/,"");var ATTR_NAMES=["data-product-id","data-productid","data-product_id","product-id","productid","product_id","data-source-entity-id","source-entity-id","source_entity_id","data-product","data-metadata","data-meta"];var DATASET_KEYS=["productId","productid","product_id","sourceEntityId","sourceentityid","source_entity_id","product","metadata","meta"];function readProductId(value){if(typeof value!=="string"||value.length===0)return null;if(/^[0-9]{6,}$/.test(value))return value;var match=value.match(/(?:product(?:_|-)?id|source(?:_|-)?entity(?:_|-)?id)["'=:\s]+([0-9]{6,})/i);return match?match[1]:null}function extractProductId(start){for(var node=start;node&&node!==document.body;node=node.parentElement){for(var i=0;i<ATTR_NAMES.length;i++){var attrValue=node.getAttribute&&node.getAttribute(ATTR_NAMES[i]);var attrProductId=readProductId(attrValue);if(attrProductId)return attrProductId}var dataset=node.dataset||null;if(dataset){for(var j=0;j<DATASET_KEYS.length;j++){var dataValue=dataset[DATASET_KEYS[j]];var dataProductId=readProductId(dataValue);if(dataProductId)return dataProductId}}}return null}function isInlineMediaSlotElement(node){return !!(node&&node.getAttribute&&node.getAttribute("data-clippy-inline-media-slot")!==null)}function findInlineMediaSlot(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(isInlineMediaSlotElement(node))return node}return null}function readInlineMediaUrl(node){if(!node)return null;return node.getAttribute&&((node.getAttribute("data-clippy-inline-media-url")||node.getAttribute("data-url")||node.getAttribute("data_url")))||node.href||null}function stripHash(url){return String(url).replace(/#.*$/,"")}function urlsMatch(a,b){if(!a||!b)return false;try{return stripHash(new URL(a,loc).href)===stripHash(new URL(b,loc).href)}catch(_){return stripHash(a)===stripHash(b)}}function isFirstPartyReelUrl(value){try{var url=new URL(value,loc);if(url.protocol!=="https:")return false;var host=url.hostname.toLowerCase();var supported=host==="instagram.com"||host.endsWith(".instagram.com")||host==="facebook.com"||host.endsWith(".facebook.com");return supported&&/\/reels?\//i.test(url.pathname)}catch(_){return false}}function isInlineMediaUrlClick(node,href){var slot=findInlineMediaSlot(node);if(!slot)return false;var slotUrl=readInlineMediaUrl(slot);if(slotUrl)return urlsMatch(href,slotUrl);return isFirstPartyReelUrl(href)}function findDataHref(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(node.getAttribute){var href=node.getAttribute("data-href")||node.getAttribute("data-url");if(href)return{href:href,node:node}}}return null}var nativeOpen=window.open;window.open=function(url){if(parent!==window&&typeof url==="string"&&/^https?:\/\//.test(url)){parent.postMessage({type:"ecto:usercontent-link-click",href:url},"*");return null}return nativeOpen?nativeOpen.apply(window,arguments):null};document.addEventListener("click",function(e){var target=e.target instanceof Element?e.target:null;if(!target)return;if(parent===window)return;var a=target.closest?target.closest("a[href]"):null;if(a&&a.href&&/^https?:\/\//.test(a.href)&&a.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(a,a.href))return;var productId=extractProductId(target)||extractProductId(a);if(productId){e.preventDefault();parent.postMessage({type:"ecto-artifact-link-click",productId:productId},"*");return}e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:a.href},"*");return}var dataHref=findDataHref(target);if(dataHref&&/^https?:\/\//.test(dataHref.href)&&dataHref.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(dataHref.node,dataHref.href))return;e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:dataHref.href},"*")}},true)})();</script><script>(function(){var FOCUS_TYPE="ecto:artifact-focus-request";var CLOSE_TYPE="ecto:artifact-close-request";function focusArtifactDocument(){var body=document.body;if(!body)return;try{window.focus();}catch(e){}if(!body.hasAttribute("tabindex"))body.setAttribute("tabindex","-1");try{body.focus({preventScroll:true});}catch(e){try{body.focus();}catch(e2){}}}window.addEventListener("message",function(event){if(event.source!==window.parent)return;var data=event.data;if(!data||typeof data!=="object"||data.type!==FOCUS_TYPE)return;if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",focusArtifactDocument,{once:true});return;}focusArtifactDocument();});window.addEventListener("keydown",function(event){if(event.key!=="Escape")return;window.setTimeout(function(){if(event.defaultPrevented)return;window.parent.postMessage({type:CLOSE_TYPE},"*");},0);});})();</script></body>
